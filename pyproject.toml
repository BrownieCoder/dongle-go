[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dongle-go"
version = "0.1.0.dev0"
description = "A bilingual setup assistant for first-generation DJI USB cellular dongles"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["pyserial==3.5", "pyusb==1.3.1", "libusb-package==1.0.26.3", "customtkinter==5.2.2", "Pillow==11.3.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.16.0"]

[project.gui-scripts]
dongle-go = "dongle_go.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dongle_go = ["assets/*.png"]
