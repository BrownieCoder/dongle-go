name: Test and build preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[build]"
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Tests (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Tests (native desktop)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - name: Build desktop preview
        if: runner.os != 'Linux'
        run: python scripts/build.py
      - name: Launch the unpacked app (simulation only)
        if: runner.os != 'Linux'
        run: python scripts/smoke_bundle.py
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: Dongle-Go-${{ runner.os }}-${{ runner.arch }}-preview
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: smoke-${{ runner.os }}-${{ runner.arch }}
          path: dist/smoke-report.json
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: checksums-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.sha256
